<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Morgen-Feed</title>
<link rel="stylesheet" href="style.css?v=2026-08-17a">
</head>
<body>
  <h1 class="site-title">Morgen-Feed</h1>
  <div class="updated" id="updated-line">Lädt...</div>
  <button class="refresh-btn" id="markets-refresh-btn" title="Aktualisieren">↻</button>

  <div id="view-markets">
    <div class="section fedmakro-block" id="fedmakro-block">
      <div class="fedmakro-header">
        <h2>Makro &amp; Weltpolitik</h2>
        <button id="macro-more-btn" style="display:none">Mehr anzeigen</button>
      </div>
      <div class="headlines" id="headlines-fedmakro"></div>
    </div>

    <div class="pills" id="pills-markets">
      <div class="pills-top">
        <button class="pill pill-all" id="pill-sektoren-markets" data-category="sektor">Sektoren</button>
        <button class="pill pill-all" id="pill-indizes-markets" data-category="index">Indizes</button>
        <button class="pill pill-all" id="pill-anleihen-markets" data-label="Anleihen" data-category="anleihen">Anleihen</button>
      </div>
      <div class="pills-row" id="sektor-row" style="display:none"></div>
      <div class="pills-row" id="indizes-row" style="display:none"></div>
    </div>

    <div class="section" id="futures-section">
      <h2>Futures (Vorbörse)</h2>
      <div class="tickers"></div>
    </div>

    <div class="section" id="global-indices-section">
      <h2>Globale Indizes</h2>
      <div class="big-index" id="big-index-view" style="display:none"></div>
      <div class="tickers"></div>
    </div>

    <div id="index-holdings"></div>

    <div class="section" id="bonds-section">
      <h2>Anleihen (USA)</h2>
      <div class="tickers"></div>
    </div>

    <div id="position-sections"></div>

    <div class="headlines" id="headlines-markets"></div>
    <button id="more-btn" style="display:none">Mehr anzeigen</button>
  </div>

  <script src="app.js?v=2026-08-17a"></script>
</body>
</html>
