name: Marktfeed sammeln

on:
  schedule:
    # Feste Laufzeiten, umgerechnet fuer MESZ (UTC+2, Sommerzeit).
    # Im Winter (MEZ, UTC+1) verschieben sich die Zeiten um -1h relativ
    # zur deutschen Uhrzeit - dann muessen die Werte um 1h erhoeht werden.
    - cron: "30 5 * * *"   # 07:30 MESZ
    - cron: "0 6 * * *"    # 08:00 MESZ
    - cron: "0 7 * * *"    # 09:00 MESZ
    - cron: "30 12 * * *"  # 14:30 MESZ
    - cron: "0 13 * * *"   # 15:00 MESZ
  workflow_dispatch: {}   # erlaubt manuellen Start über den "Actions"-Tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Kurse abrufen
        run: python scripts/fetch_market.py

      # Muss NACH "Kurse abrufen" laufen - liest die dort ermittelten
      # groessten Tagesbewegungen (docs/data/market.json: top_movers) fuer
      # gezielte "warum bewegt sich das"-Suchen, s. load_top_movers() in
      # fetch_news.py.
      - name: News sammeln
        run: python scripts/fetch_news.py

      - name: Änderungen committen
        run: |
          git config user.name "marktfeed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push